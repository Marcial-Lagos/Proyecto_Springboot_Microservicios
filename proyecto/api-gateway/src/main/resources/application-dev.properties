# Puerto donde correrá el API Gateway.
server.port=8080

# Nombre registrado en Eureka.
spring.application.name=API-GATEWAY

# Descubre automáticamente los servicios registrados en Eureka.
spring.cloud.gateway.server.webmvc.discovery.locator.enabled=true
spring.cloud.gateway.server.webmvc.discovery.locator.lower-case-service-id=true

# Rutas de negocio concentradas en el Gateway.
spring.cloud.gateway.server.webmvc.routes[0].id=auth-route
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=usuarios-route
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://USUARIOS-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/usuarios/**

spring.cloud.gateway.server.webmvc.routes[2].id=productos-route
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://PRODUCTOS-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/productos/**

spring.cloud.gateway.server.webmvc.routes[3].id=pedidos-route
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://PEDIDOS-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/pedidos/**

spring.cloud.gateway.server.webmvc.routes[4].id=pagos-route
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://PAGOS-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/v1/pagos/**

spring.cloud.gateway.server.webmvc.routes[5].id=envios-route
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://ENVIOS-SERVICE
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/v1/envios/**

spring.cloud.gateway.server.webmvc.routes[6].id=inventario-route
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://INVENTARIO-SERVICE
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/v1/inventario/**

spring.cloud.gateway.server.webmvc.routes[7].id=notificaciones-route
spring.cloud.gateway.server.webmvc.routes[7].uri=lb://NOTIFICACIONES-SERVICE
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/api/v1/notificaciones/**

spring.cloud.gateway.server.webmvc.routes[8].id=resenas-route
spring.cloud.gateway.server.webmvc.routes[8].uri=lb://RESENAS-SERVICE
spring.cloud.gateway.server.webmvc.routes[8].predicates[0]=Path=/api/v1/resenas/**

spring.cloud.gateway.server.webmvc.routes[9].id=cupones-route
spring.cloud.gateway.server.webmvc.routes[9].uri=lb://CUPONES-SERVICE
spring.cloud.gateway.server.webmvc.routes[9].predicates[0]=Path=/api/v1/cupones/**

# Rutas de documentación. Se elimina el prefijo del servicio antes de llegar al microservicio.
spring.cloud.gateway.server.webmvc.routes[10].id=auth-docs
spring.cloud.gateway.server.webmvc.routes[10].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[10].predicates[0]=Path=/auth/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[10].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[11].id=usuarios-docs
spring.cloud.gateway.server.webmvc.routes[11].uri=lb://USUARIOS-SERVICE
spring.cloud.gateway.server.webmvc.routes[11].predicates[0]=Path=/usuarios/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[11].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[12].id=productos-docs
spring.cloud.gateway.server.webmvc.routes[12].uri=lb://PRODUCTOS-SERVICE
spring.cloud.gateway.server.webmvc.routes[12].predicates[0]=Path=/productos/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[12].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[13].id=pedidos-docs
spring.cloud.gateway.server.webmvc.routes[13].uri=lb://PEDIDOS-SERVICE
spring.cloud.gateway.server.webmvc.routes[13].predicates[0]=Path=/pedidos/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[13].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[14].id=pagos-docs
spring.cloud.gateway.server.webmvc.routes[14].uri=lb://PAGOS-SERVICE
spring.cloud.gateway.server.webmvc.routes[14].predicates[0]=Path=/pagos/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[14].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[15].id=envios-docs
spring.cloud.gateway.server.webmvc.routes[15].uri=lb://ENVIOS-SERVICE
spring.cloud.gateway.server.webmvc.routes[15].predicates[0]=Path=/envios/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[15].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[16].id=inventario-docs
spring.cloud.gateway.server.webmvc.routes[16].uri=lb://INVENTARIO-SERVICE
spring.cloud.gateway.server.webmvc.routes[16].predicates[0]=Path=/inventario/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[16].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[17].id=notificaciones-docs
spring.cloud.gateway.server.webmvc.routes[17].uri=lb://NOTIFICACIONES-SERVICE
spring.cloud.gateway.server.webmvc.routes[17].predicates[0]=Path=/notificaciones/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[17].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[18].id=resenas-docs
spring.cloud.gateway.server.webmvc.routes[18].uri=lb://RESENAS-SERVICE
spring.cloud.gateway.server.webmvc.routes[18].predicates[0]=Path=/resenas/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[18].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[19].id=cupones-docs
spring.cloud.gateway.server.webmvc.routes[19].uri=lb://CUPONES-SERVICE
spring.cloud.gateway.server.webmvc.routes[19].predicates[0]=Path=/cupones/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[19].filters[0]=StripPrefix=1

# Documentación Swagger centralizada.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.enable-hateoas=false

springdoc.swagger-ui.urls[0].name=1. Autenticación
springdoc.swagger-ui.urls[0].url=/auth/v3/api-docs
springdoc.swagger-ui.urls[1].name=2. Usuarios
springdoc.swagger-ui.urls[1].url=/usuarios/v3/api-docs
springdoc.swagger-ui.urls[2].name=3. Productos
springdoc.swagger-ui.urls[2].url=/productos/v3/api-docs
springdoc.swagger-ui.urls[3].name=4. Pedidos
springdoc.swagger-ui.urls[3].url=/pedidos/v3/api-docs
springdoc.swagger-ui.urls[4].name=5. Pagos
springdoc.swagger-ui.urls[4].url=/pagos/v3/api-docs
springdoc.swagger-ui.urls[5].name=6. Envíos
springdoc.swagger-ui.urls[5].url=/envios/v3/api-docs
springdoc.swagger-ui.urls[6].name=7. Inventario
springdoc.swagger-ui.urls[6].url=/inventario/v3/api-docs
springdoc.swagger-ui.urls[7].name=8. Notificaciones
springdoc.swagger-ui.urls[7].url=/notificaciones/v3/api-docs
springdoc.swagger-ui.urls[8].name=9. Reseñas
springdoc.swagger-ui.urls[8].url=/resenas/v3/api-docs
springdoc.swagger-ui.urls[9].name=10. Cupones
springdoc.swagger-ui.urls[9].url=/cupones/v3/api-docs

# URL donde está publicado Eureka Server.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Endpoints de monitoreo expuestos por el Gateway.
management.endpoints.web.exposure.include=health,info,gateway

# Clave usada por el filtro JWT del Gateway.
jwt.secret=${JWT_SECRET:clave-super-secreta-para-clase-123456}
