# Ajustes de ejecución Docker para desarrollo local.
# Docker Compose combina automáticamente este archivo con docker-compose.yml.
# Permite que los microservicios usen sus configuraciones dev y descubran
# Eureka mediante el hostname interno de la red Docker.

services:
  api-gateway:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_TOOL_OPTIONS: "-Deureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/"

  ms-auth:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_TOOL_OPTIONS: "-Deureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/"

