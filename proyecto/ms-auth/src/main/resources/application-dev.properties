# Puerto donde correrÃ¡ el microservicio AutenticaciÃ³n.
server.port=8083

# Nombre de la aplicaciÃ³n registrado en Eureka.
spring.application.name=ms-auth

# URL de conexiÃ³n a MySQL local.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/db_usuario}

# Usuario de MySQL local.
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}

# Password de MySQL local.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Driver JDBC de MySQL.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate no crea ni modifica tablas, porque Flyway administra el esquema.
spring.jpa.hibernate.ddl-auto=none

# Muestra las consultas SQL en consola.
spring.jpa.show-sql=true

# Da formato legible al SQL mostrado en consola.
spring.jpa.properties.hibernate.format_sql=true

# Dialecto de Hibernate para MySQL.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Evita consultas fuera de la capa de persistencia durante la serializaciÃ³n.
spring.jpa.open-in-view=false

# Activa Flyway al iniciar la aplicaciÃ³n.
spring.flyway.enabled=true

# Permite iniciar Flyway aunque ya existan tablas.
spring.flyway.baseline-on-migrate=true

# Ruta donde estÃ¡n los scripts SQL de migraciÃ³n.
spring.flyway.locations=classpath:db/migration

# Permite ejecutar flyway clean manualmente durante desarrollo.
spring.flyway.clean-disabled=false

# Clave secreta para firmar el JWT.
jwt.secret=${JWT_SECRET}

# Tiempo de duraciÃ³n del token en milisegundos: 3.600.000 = 1 hora.
jwt.expiration=3600000

# DocumentaciÃ³n Swagger.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# HATEOAS no se utiliza en este proyecto.
springdoc.enable-hateoas=false

# URL donde estÃ¡ publicado Eureka Server.
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

# Registra este microservicio en Eureka al iniciar.
eureka.client.register-with-eureka=true

# Permite consultar el registro de servicios.
eureka.client.fetch-registry=true

# Publica preferentemente la IP del servicio en vez del hostname.
eureka.instance.prefer-ip-address=true
