# Nombre de la aplicación durante pruebas.
spring.application.name=AUTH-SERVICE-TEST
server.port=0

# Base de datos H2 en memoria. Se crea al iniciar las pruebas y desaparece al terminar.
spring.datasource.url=jdbc:h2:mem:ms_auth_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea las tablas de prueba sin ejecutar las migraciones MySQL de Flyway.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# No se registran servicios externos durante pruebas.
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Valores de prueba para JwtUtil.
jwt.secret=clave-de-prueba-para-jwt-con-longitud-suficiente-2026
jwt.expiration=3600000
