# Perfil exclusivo para pruebas: H2 vive en memoria y desaparece al finalizar Maven.
spring.application.name=USUARIOS-SERVICE-TEST
server.port=0

# Base temporal de tests. No se conecta a MySQL ni a Docker.
spring.datasource.url=jdbc:h2:mem:ms_usuarios_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea las tablas para la prueba y las elimina al terminar.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Se desactivan integraciones externas durante pruebas.
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
