name: foodexpress

services:
  mysql:
    image: mysql:8.4
    container_name: foodexpress-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: system
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: db_usuario
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -psystem --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - foodexpress-net

  eureka-server:
    build: ./eureka-server
    container_name: foodexpress-eureka
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8761"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    ports:
      - "8761:8761"
    networks:
      - foodexpress-net

  api-gateway:
    build: ./api-gateway
    container_name: foodexpress-gateway
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: clave-super-secreta-para-clase-123456
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
    networks:
      - foodexpress-net

  ms-auth:
    build: ./ms-auth
    container_name: foodexpress-ms-auth
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/db_usuario
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: system
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: clave-super-secreta-para-clase-123456
      JWT_EXPIRATION: "3600000"
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - foodexpress-net

  ms-usuarios:
    build: ./ms-usuarios
    container_name: foodexpress-ms-usuarios
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
